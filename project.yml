name: Tape
options:
  bundleIdPrefix: com.maikbluhm
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  TapeCore:
    path: TapeCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEAD_CODE_STRIPPING: YES
targets:
  Tape:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: TapeCore
        product: TapeCore
      - package: TapeCore
        product: HardwarePresets
    # Debug signs ad hoc (CODE_SIGN_IDENTITY "-") so it builds without the Developer ID certificate. The xcconfig
    # includes an optional, untracked Local.xcconfig that can name a real identity instead: an ad-hoc signature
    # changes with every build, and macOS then asks for the microphone again.
    configFiles:
      Debug: App/Debug.xcconfig
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: PRQ9CL3URA
        ENABLE_HARDENED_RUNTIME: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.runningoncliffs.tape
        MARKETING_VERSION: 0.10.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Tape
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Tape.entitlements
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
